<!DOCTYPE html>
<html lang="es" data-bs-theme="dark" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout - Hero Games</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="../css/estilos.css">
</head>

<body class="d-flex flex-column min-vh-100">

    <header th:replace="~{fragments/navbar :: navbar}">
    </header>


    <main class="container my-5 flex-grow-1">
                        <!-- loguito de la tarjetita -->
        <h1 class="mb-4 text-info fw-bold"><i class="bi bi-credit-card"></i> Finalizar Compra</h1>

        <form th:action="@{/checkout/confirmar}" method="post" class="row g-4">
            <div class="col-lg-8">

                <div class="card border-secondary shadow p-4 mb-4">
                    <h4 class="text-light mb-3">1. Datos de Envío</h4>
                    <div class="mb-3">
                        <label class="form-label text-secondary">Nombre y Apellido</label>
                        <input type="text" name="nombre" required
                            th:value="${session.usuario != null} ? ${session.usuario.nombre} + ' ' + ${session.usuario.apellidos} : ''"
                            class="form-control bg-dark text-white border-secondary" placeholder="Ej. Joel Vivanco">
                    </div>
                    <div class="mb-3">
                        <label class="form-label text-secondary">Dirección de Entrega</label>
                        <input type="text" name="direccion" required
                            class="form-control bg-dark text-white border-secondary" placeholder="Av. Principal 123, Puente Piedra">
                    </div>

                    <h4 class="text-light mt-4 mb-3">2. Método de Pago</h4>
                    <div class="form-check mb-2">
                        <input class="form-check-input" type="radio" name="metodoPago" id="tarjeta" checked>
                        <label class="form-check-label text-secondary" for="tarjeta">Tarjeta de Crédito o Débito</label>
                    </div>
                    <div class="form-check mb-2">
                        <input class="form-check-input" type="radio" name="metodoPago" id="billetera">
                        <label class="form-check-label text-secondary" for="billetera">Yape / Plin / Transferencia</label>
                    </div>
                </div>


            </div>

            <div class="col-lg-4">
                <div class="card border-secondary shadow p-4 sticky-top" style="top: 20px;">
                    <h4 class="text-info mb-3">Tu Pedido</h4>
                    <div th:each="d : ${items}" class="d-flex justify-content-between text-secondary mb-2">
                        <span th:text="${d.producto.nombre} + ' (x' + ${d.cantidad} + ')'">Producto (x1)</span>
                        <span th:text="'S/ ' + ${#numbers.formatDecimal(d.subtotal, 1, 'COMMA', 2, 'POINT')}">S/ 0.00</span>
                    </div>
                    <hr class="border-secondary">
                    <div class="d-flex justify-content-between text-secondary mb-2">
                        <span>Subtotal</span>
                        <span th:text="'S/ ' + ${#numbers.formatDecimal(total, 1, 'COMMA', 2, 'POINT')}">S/ 0.00</span>
                    </div>
                    <div class="d-flex justify-content-between text-secondary mb-2">
                        <span>IGV (18%)</span>
                        <span th:text="'S/ ' + ${#numbers.formatDecimal(total * 0.18, 1, 'COMMA', 2, 'POINT')}">S/ 0.00</span>
                    </div>
                    <div class="d-flex justify-content-between text-light fw-bold fs-5 mb-4">
                        <span>Total a Pagar</span>
                        <span class="text-info" th:text="'S/ ' + ${#numbers.formatDecimal(total * 1.18, 1, 'COMMA', 2, 'POINT')}">S/ 0.00</span>
                    </div>
                    <button type="submit" class="btn btn-success w-100 py-2 fw-bold">Confirmar y Pagar</button>
                </div>
            </div>
        </form>
    </main>

    <footer th:replace="~{fragments/footer :: footer}">
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
