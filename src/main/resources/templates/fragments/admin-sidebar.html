<!DOCTYPE html>
<html lang="es" xmlns:th="https://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<body>
<aside th:fragment="admin-sidebar(activa)" class="col-md-3 col-xl-2 bg-body-tertiary border-end p-0 d-md-flex flex-column">
    <div class="offcanvas-md offcanvas-start bg-body-tertiary d-md-flex flex-md-column flex-grow-1" tabindex="-1" id="sidebarMenu">
        <div class="offcanvas-header border-bottom">
            <h5 class="offcanvas-title fst-italic text-info">Hero Games</h5>
            <button type="button" class="btn-close" data-bs-dismiss="offcanvas" data-bs-target="#sidebarMenu"
                    aria-label="Cerrar"></button>
        </div>
        <div class="offcanvas-body d-flex flex-column flex-grow-1 p-3">
            <div class="text-center mb-3 d-none d-md-block">
                <h4 class="fst-italic text-info mb-0">Hero Games</h4>
                <small class="text-secondary">Admin Panel</small>
            </div>
            <div class="d-flex align-items-center gap-3 p-2 mb-3 rounded border bg-body">
                <img src="https://i.pravatar.cc/96?img=12" alt="Foto de perfil"
                     class="rounded-circle object-fit-cover" width="44" height="44">
                <div class="lh-sm overflow-hidden">
                    <div class="fw-semibold text-truncate">Carlos Mendoza</div>
                    <small class="text-secondary">Administrador</small>
                </div>
            </div>
            <ul class="nav nav-pills flex-column gap-1 w-100">
                <li class="nav-item">
                    <a class="nav-link" th:classappend="${activa == 'dashboard'} ? 'active'"
                       th:href="@{/dashboard}"><i class="bi bi-speedometer2 me-2"></i>Dashboard</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:classappend="${activa == 'compras'} ? 'active'"
                       th:href="@{/admin/compras}"><i class="bi bi-bag me-2"></i>Compras</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:classappend="${activa == 'clientes'} ? 'active'"
                       th:href="@{/admin/clientes}"><i class="bi bi-people me-2"></i>Clientes</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:classappend="${activa == 'productos'} ? 'active'"
                       th:href="@{/admin/productos}"><i class="bi bi-controller me-2"></i>Productos</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:classappend="${activa == 'reportes'} ? 'active'"
                       th:href="@{/admin/reportes}"><i class="bi bi-bar-chart-line me-2"></i>Reportes</a>
                </li>
            </ul>
            <div class="pt-4"></div>
            <a th:href="@{/index}" class="btn btn-outline-danger w-100 mt-auto"><i class="bi bi-box-arrow-right me-2"></i>salir</a>
        </div>
    </div>
</aside>
</body>
</html>
