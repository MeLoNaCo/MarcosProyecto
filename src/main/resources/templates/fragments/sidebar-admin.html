<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>

<!-- Barra superior solo móvil -->
<div th:fragment="topbar" class="d-flex d-md-none justify-content-between align-items-center bg-dark-custom text-white p-3">
    <a th:href="@{/admin}" class="text-accent fst-italic fs-5 text-decoration-none">Hero Games</a>
    <button class="btn btn-outline-light" type="button" data-bs-toggle="offcanvas" data-bs-target="#sidebarMenu">
        &#9776;
    </button>
</div>

<!-- Sidebar escritorio. Uso: ~{fragments/sidebar-admin :: sidebar('productos')} -->
<nav th:fragment="sidebar(activo)" class="bg-dark-custom text-light p-3 d-none d-md-flex flex-column sidebar-desktop">
    <div class="text-center mb-4">
        <a th:href="@{/admin}" class="text-decoration-none">
            <h4 class="text-accent fst-italic mb-0">Hero Games</h4>
        </a>
        <small class="text-secondary">Admin Panel</small>
    </div>
    <ul class="nav nav-pills flex-column gap-1">
        <li class="nav-item">
            <a class="nav-link" th:href="@{/admin}"
                th:classappend="${activo == 'dashboard'} ? 'active text-white' : 'text-light'">Dashboard</a>
        </li>
        <li class="nav-item">
            <a class="nav-link" th:href="@{/admin/compras}"
                th:classappend="${activo == 'compras'} ? 'active text-white' : 'text-light'">Compras</a>
        </li>
        <li class="nav-item">
            <a class="nav-link" th:href="@{/admin/clientes}"
                th:classappend="${activo == 'clientes'} ? 'active text-white' : 'text-light'">Clientes</a>
        </li>
        <li class="nav-item">
            <a class="nav-link" th:href="@{/admin/productos}"
                th:classappend="${activo == 'productos'} ? 'active text-white' : 'text-light'">Productos</a>
        </li>
        <li class="nav-item">
            <a class="nav-link" th:href="@{/admin/categorias}"
                th:classappend="${activo == 'categorias'} ? 'active text-white' : 'text-light'">Categorías</a>
        </li>
        <li class="nav-item">
            <a class="nav-link" th:href="@{/admin/reportes}"
                th:classappend="${activo == 'reportes'} ? 'active text-white' : 'text-light'">Reportes</a>
        </li>
    </ul>
    <div class="mt-auto pt-4">
        <a th:href="@{/}" class="btn btn-outline-light w-100 mb-2">Ver tienda</a>
        <a th:href="@{/logout}" class="btn btn-outline-danger w-100">Cerrar Sesión</a>
    </div>
</nav>

<!-- Sidebar móvil (offcanvas). Mismo parámetro activo -->
<div th:fragment="sidebarMovil(activo)" class="offcanvas offcanvas-start bg-dark-custom text-light d-md-none"
    tabindex="-1" id="sidebarMenu">
    <div class="offcanvas-header">
        <h5 class="text-accent fst-italic mb-0">Hero Games</h5>
        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="offcanvas"></button>
    </div>
    <div class="offcanvas-body d-flex flex-column">
        <ul class="nav nav-pills flex-column gap-1">
            <li class="nav-item">
                <a class="nav-link" th:href="@{/admin}"
                    th:classappend="${activo == 'dashboard'} ? 'active text-white' : 'text-light'">Dashboard</a>
            </li>
            <li class="nav-item">
                <a class="nav-link" th:href="@{/admin/compras}"
                    th:classappend="${activo == 'compras'} ? 'active text-white' : 'text-light'">Compras</a>
            </li>
            <li class="nav-item">
                <a class="nav-link" th:href="@{/admin/clientes}"
                    th:classappend="${activo == 'clientes'} ? 'active text-white' : 'text-light'">Clientes</a>
            </li>
            <li class="nav-item">
                <a class="nav-link" th:href="@{/admin/productos}"
                    th:classappend="${activo == 'productos'} ? 'active text-white' : 'text-light'">Productos</a>
            </li>
            <li class="nav-item">
                <a class="nav-link" th:href="@{/admin/categorias}"
                    th:classappend="${activo == 'categorias'} ? 'active text-white' : 'text-light'">Categorías</a>
            </li>
            <li class="nav-item">
                <a class="nav-link" th:href="@{/admin/reportes}"
                    th:classappend="${activo == 'reportes'} ? 'active text-white' : 'text-light'">Reportes</a>
            </li>
        </ul>
        <div class="mt-auto pt-4">
            <a th:href="@{/}" class="btn btn-outline-light w-100 mb-2">Ver tienda</a>
            <a th:href="@{/logout}" class="btn btn-outline-danger w-100">Cerrar Sesión</a>
        </div>
    </div>
</div>

</body>
</html>
