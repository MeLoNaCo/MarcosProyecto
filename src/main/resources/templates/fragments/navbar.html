<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<body>

    <nav th:fragment="navbar" class="navbar navbar-expand-lg bg-body-tertiary">
        <div class="container-fluid">
            <a class="navbar-brand" th:href="@{/}">
                <img th:src="@{/img/Herogameslogo.png}" alt="Bootstrap" width="60" height="48">
                HeroGames
            </a>
            <button class="navbar-toggler" src="img/Herogameslogo.png" type="button" data-bs-toggle="collapse" data-bs-target="#navbarText"
                    aria-controls="navbarText" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarText">
                <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/catalogo}">Catálogo</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/publicidad}">Publicidad</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/about}">Acerca de</a>
                    </li>
                </ul>

                <div class="Derecha d-flex gap-4 fs-3">
                    <a th:href="@{/carrito}" class="link-secondary" aria-label="Carrito">
                        <i class="bi bi-cart"></i>
                    </a>
                    <a th:href="${session.usuario != null} ? @{/cuenta} : @{/login}" class="link-secondary" aria-label="Cuenta">
                        <i class="bi bi-person"></i>
                    </a>
                </div>
            </div>
        </div>
    </nav>

</body>
</html>
