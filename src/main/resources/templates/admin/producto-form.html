<!DOCTYPE html>
<html lang="es" data-bs-theme="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hero Games - Producto</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
</head>

<body>

    <nav class="navbar bg-body-tertiary border-bottom d-md-none">
        <div class="container-fluid">
            <span class="navbar-brand fst-italic text-info mb-0">Hero Games</span>
            <button class="navbar-toggler" type="button" data-bs-toggle="offcanvas" data-bs-target="#sidebarMenu"
                aria-controls="sidebarMenu" aria-label="Abrir menú">
                <span class="navbar-toggler-icon"></span>
            </button>
        </div>
    </nav>

    <div class="container-fluid">
        <div class="row min-vh-100">

            <aside th:replace="~{fragments/admin-sidebar :: admin-sidebar('productos')}">>
            </aside>

            <main class="col-md-9 col-xl-10 p-3 p-md-4">
                <h2 class="mb-4 fs-3" th:text="${producto.id == null} ? 'Nuevo Producto' : 'Editar Producto'">Producto</h2>

                <div th:if="${error}" class="alert alert-danger" th:text="${error}">Error</div>

                <div class="card" style="max-width: 720px;">
                    <div class="card-body">
                        <form th:action="@{/admin/productos/guardar}" method="post">
                            <input type="hidden" name="id" th:value="${producto.id}">
                            <div class="row g-3">
                                <div class="col-md-8">
                                    <label class="form-label">Nombre</label>
                                    <input type="text" name="nombre" required class="form-control" th:value="${producto.nombre}">
                                </div>
                                <div class="col-md-4">
                                    <label class="form-label">Categoría</label>
                                    <select name="categoria.id" required class="form-select">
                                        <option th:each="c : ${categorias}" th:value="${c.id}" th:text="${c.nombre}"
                                            th:selected="${producto.categoria != null and producto.categoria.id == c.id}">Cat</option>
                                    </select>
                                </div>
                            </div>
                            <div class="mb-3 mt-3">
                                <label class="form-label">Descripción</label>
                                <textarea name="descripcion" rows="2" class="form-control" th:text="${producto.descripcion}"></textarea>
                            </div>
                            <div class="row g-3">
                                <div class="col-md-4">
                                    <label class="form-label">Precio (S/)</label>
                                    <input type="number" name="precio" required min="0" step="0.01" class="form-control" th:value="${producto.precio}">
                                </div>
                                <div class="col-md-4">
                                    <label class="form-label">Stock</label>
                                    <input type="number" name="stock" required min="0" step="1" class="form-control" th:value="${producto.stock}">
                                </div>
                                <div class="col-md-4">
                                    <label class="form-label">Oferta % (0-90)</label>
                                    <input type="number" name="oferta" min="0" max="90" step="1" class="form-control" th:value="${producto.oferta}">
                                </div>
                            </div>
                            <div class="mb-3 mt-3">
                                <label class="form-label">URL de imagen</label>
                                <input type="text" name="imagenUrl" class="form-control" th:value="${producto.imagenUrl}">
                            </div>
                            <div class="form-check form-switch mb-3">
                                <input type="hidden" name="_activo" value="on">
                                <input class="form-check-input" type="checkbox" name="activo" value="true"
                                    th:checked="${producto.activo}" id="chkActivo">
                                <label class="form-check-label" for="chkActivo">Activo (visible en tienda)</label>
                            </div>
                            <div class="d-flex gap-2">
                                <button type="submit" class="btn btn-primary">Guardar</button>
                                <a th:href="@{/admin/productos}" class="btn btn-outline-secondary">Cancelar</a>
                            </div>
                        </form>
                    </div>
                </div>
            </main>

        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
</body>

</html>
