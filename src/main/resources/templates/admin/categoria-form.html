<!DOCTYPE html>
<html lang="es" data-bs-theme="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hero Games - Categoría</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
</head>

<body>

    <nav class="navbar bg-body-tertiary border-bottom d-md-none">
        <div class="container-fluid">
            <span class="navbar-brand fst-italic text-info mb-0">Hero Games</span>
            <button class="navbar-toggler" type="button" data-bs-toggle="offcanvas" data-bs-target="#sidebarMenu"
                aria-controls="sidebarMenu" aria-label="Abrir menú">
                <span class="navbar-toggler-icon"></span>
            </button>
        </div>
    </nav>

    <div class="container-fluid">
        <div class="row min-vh-100">

            <aside th:replace="~{fragments/admin-sidebar :: admin-sidebar('categorias')}">>
            </aside>

            <main class="col-md-9 col-xl-10 p-3 p-md-4">
                <h2 class="mb-4 fs-3" th:text="${categoria.id == null} ? 'Nueva Categoría' : 'Editar Categoría'">Categoría</h2>

                <div th:if="${error}" class="alert alert-danger" th:text="${error}">Error</div>

                <div class="card" style="max-width: 720px;">
                    <div class="card-body">
                        <form th:action="@{/admin/categorias/guardar}" method="post">
                            <input type="hidden" name="id" th:value="${categoria.id}">
                            <div class="mb-3">
                                <label class="form-label">Nombre</label>
                                <input type="text" name="nombre" required class="form-control" th:value="${categoria.nombre}">
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Descripción</label>
                                <textarea name="descripcion" rows="2" class="form-control" th:text="${categoria.descripcion}"></textarea>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Descuento % (0-90)</label>
                                <input type="number" name="descuentoPct" min="0" max="90" step="1" class="form-control" th:value="${categoria.descuentoPct}">
                            </div>
                            <div class="d-flex gap-2">
                                <button type="submit" class="btn btn-primary">Guardar</button>
                                <a th:href="@{/admin/categorias}" class="btn btn-outline-secondary">Cancelar</a>
                            </div>
                        </form>
                    </div>
                </div>
            </main>

        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
</body>

</html>
