<!DOCTYPE html>
<html lang="es" data-bs-theme="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hero Games - Compras</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
</head>

<body>

    <!-- Barra superior (solo móvil) -->
    <nav class="navbar bg-body-tertiary border-bottom d-md-none">
        <div class="container-fluid">
            <span class="navbar-brand fst-italic text-info mb-0">Hero Games</span>
            <button class="navbar-toggler" type="button" data-bs-toggle="offcanvas" data-bs-target="#sidebarMenu"
                aria-controls="sidebarMenu" aria-label="Abrir menú">
                <span class="navbar-toggler-icon"></span>
            </button>
        </div>
    </nav>

    <div class="container-fluid">
        <div class="row min-vh-100">

            <aside th:replace="~{fragments/admin-sidebar :: admin-sidebar('compras')}">>
            </aside>

            <!-- Contenido -->
            <main class="col-md-9 col-xl-10 p-3 p-md-4">
                <div class="d-flex justify-content-between align-items-center mb-4">
                    <h2 class="mb-0 fs-3">Compras</h2>
                </div>
                <div class="card">
                    <div class="table-responsive">
                        <table class="table table-hover align-middle mb-0">
                            <thead>
                                <tr><th>N° Orden</th><th>Cliente</th><th>Fecha</th><th>Monto</th><th>Estado</th><th class="text-end">Acciones</th></tr>
                            </thead>
                            <tbody>
                            <tr th:each="v : ${ventas}"><td th:text="'#' + ${#numbers.formatInteger(v.id, 4)}">#0001</td><td th:text="${v.nombreComprador}">Cliente</td><td th:text="${#temporals.format(v.fecha, 'dd/MM/yyyy')}">fecha</td><td><span class="text-success fw-bold" th:text="'S/ ' + ${#numbers.formatDecimal(v.total, 1, 'COMMA', 2, 'POINT')}">S/ 0.00</span></td><td><span class="badge text-bg-success">Pagado</span></td><td class="text-end"><button class="btn btn-sm btn-outline-secondary" data-bs-toggle="modal" th:data-bs-target="'#modalCompra' + ${v.id}">Ver</button></td></tr>
                            <tr th:if="${#lists.isEmpty(ventas)}"><td colspan="6" class="text-center text-secondary">Sin compras registradas.</td></tr>
                            </tbody>
                        </table>
                    </div>
                </div>
                <div th:each="v : ${ventas}" class="modal fade" th:id="'modalCompra' + ${v.id}" tabindex="-1" aria-hidden="true">
                    <div class="modal-dialog">
                        <div class="modal-content">
                            <div class="modal-header">
                                <h5 class="modal-title" th:text="'Orden #' + ${#numbers.formatInteger(v.id, 4)}">Orden</h5>
                                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                            </div>
                            <div class="modal-body">
                                <p class="text-secondary small mb-1" th:text="'Cliente: ' + ${v.nombreComprador}">Cliente</p>
                                <p class="text-secondary small mb-3" th:text="'Envío: ' + ${v.direccion}">Envío</p>
                                <table class="table table-sm align-middle">
                                    <thead><tr><th>Producto</th><th>Cant.</th><th>Subtotal</th></tr></thead>
                                    <tbody>
                                        <tr th:each="d : ${v.detalles}"><td th:text="${d.producto.nombre}">P</td><td th:text="${d.cantidad}">1</td><td th:text="'S/ ' + ${#numbers.formatDecimal(d.subtotal, 1, 'COMMA', 2, 'POINT')}">S/</td></tr>
                                    </tbody>
                                </table>
                                <div class="d-flex justify-content-between fw-bold"><span>Total</span><span class="text-success" th:text="'S/ ' + ${#numbers.formatDecimal(v.total, 1, 'COMMA', 2, 'POINT')}">S/</span></div>
                            </div>
                            <div class="modal-footer">
                                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cerrar</button>
                            </div>
                        </div>
                    </div>
                </div>
            </main>

        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
</body>

</html>
