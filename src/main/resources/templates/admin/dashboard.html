<!DOCTYPE html>
<html lang="es" data-bs-theme="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hero Games - Dashboard</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
</head>

<body>

    <!-- Barra superior (solo móvil) -->
    <nav class="navbar bg-body-tertiary border-bottom d-md-none">
        <div class="container-fluid">
            <span class="navbar-brand fst-italic text-info mb-0">Hero Games</span>
            <button class="navbar-toggler" type="button" data-bs-toggle="offcanvas" data-bs-target="#sidebarMenu"
                aria-controls="sidebarMenu" aria-label="Abrir menú">
                <span class="navbar-toggler-icon"></span>
            </button>
        </div>
    </nav>

    <div class="container-fluid">
        <div class="row min-vh-100">

            <aside th:replace="~{fragments/admin-sidebar :: admin-sidebar('dashboard')}">
            </aside>

            <!-- Contenido -->
            <main class="col-md-9 col-xl-10 p-3 p-md-4">
                <div class="d-flex justify-content-between align-items-center mb-4">
                    <h2 class="mb-0 fs-3">Dashboard Principal</h2>
                </div>

                <div class="row g-3 mb-4">
                    <div class="col-6 col-xl-3">
                        <div class="card h-100">
                            <div class="card-body d-flex align-items-center gap-3">
                                <i class="bi bi-bag-check fs-3 lh-1 p-3 rounded-circle bg-info bg-opacity-25 text-info"></i>
                                <div>
                                    <h3 class="mb-0 fs-4">12</h3>
                                    <small class="text-secondary d-block">Compras</small>
                                    <small class="text-info">Hoy</small>
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="col-6 col-xl-3">
                        <div class="card h-100">
                            <div class="card-body d-flex align-items-center gap-3">
                                <i class="bi bi-calendar-week fs-3 lh-1 p-3 rounded-circle bg-info bg-opacity-25 text-info"></i>
                                <div>
                                    <h3 class="mb-0 fs-4">45</h3>
                                    <small class="text-secondary d-block">Compras</small>
                                    <small class="text-info">Últimos 7 días</small>
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="col-6 col-xl-3">
                        <div class="card h-100">
                            <div class="card-body d-flex align-items-center gap-3">
                                <i class="bi bi-cash-coin fs-3 lh-1 p-3 rounded-circle bg-info bg-opacity-25 text-info"></i>
                                <div>
                                    <h3 class="mb-0 fs-4">S/ 58,500</h3>
                                    <small class="text-secondary d-block">Ingresos</small>
                                    <small class="text-info">Este mes</small>
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="col-6 col-xl-3">
                        <div class="card h-100">
                            <div class="card-body d-flex align-items-center gap-3">
                                <i class="bi bi-person-plus fs-3 lh-1 p-3 rounded-circle bg-info bg-opacity-25 text-info"></i>
                                <div>
                                    <h3 class="mb-0 fs-4">8</h3>
                                    <small class="text-secondary d-block">Clientes nuevos</small>
                                    <small class="text-info">Este mes</small>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="card">
                    <div class="card-body">
                        <h5 class="card-title mb-3">Acciones Rápidas</h5>
                        <div class="d-flex flex-wrap gap-2">
                            <button class="btn btn-primary"><i class="bi bi-plus-lg me-1"></i>Nueva Compra</button>
                            <button class="btn btn-info fw-bold"><i class="bi bi-person-plus me-1"></i>Agregar Cliente</button>
                            <button class="btn btn-outline-secondary"><i class="bi bi-bar-chart-line me-1"></i>Ver Reportes</button>
                        </div>
                    </div>
                </div>
            </main>

        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
</body>

</html>
