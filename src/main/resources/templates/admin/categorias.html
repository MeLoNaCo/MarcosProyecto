<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hero Games - Categorías</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
</head>

<body>

<nav class="navbar bg-body-tertiary border-bottom d-md-none">
    <div class="container-fluid">
        <span class="navbar-brand fst-italic text-info mb-0">Hero Games</span>
        <button class="navbar-toggler" type="button" data-bs-toggle="offcanvas" data-bs-target="#sidebarMenu"
                aria-controls="sidebarMenu" aria-label="Abrir menú">
            <span class="navbar-toggler-icon"></span>
        </button>
    </div>
</nav>

<div class="container-fluid">
    <div class="row min-vh-100">

        <aside th:replace="~{fragments/admin-sidebar :: admin-sidebar('categorias')}">
        </aside>

        <main class="col-md-9 col-xl-10 p-3 p-md-4">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <h2 class="mb-0 fs-3">Categorías</h2>
                <a th:href="@{/admin/categorias/nuevo}" class="btn btn-primary">Agregar Categoría</a>
            </div>

            <div class="card">
                <div class="table-responsive">
                    <table class="table table-hover align-middle mb-0">
                        <thead>
                        <tr>
                            <th>Código</th>
                            <th>Nombre</th>
                            <th>Estado</th>
                            <th>Acciones</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:each="c : ${categorias}">
                            <td th:text="'#C' + ${#numbers.formatInteger(c.id, 3)}">#C001</td>
                            <td th:text="${c.nombre}">Nombre</td>
                            <td><span th:if="${c.activo}" class="badge text-bg-success">Activa</span><span
                                    th:unless="${c.activo}" class="badge text-bg-secondary">Inactiva</span></td>
                            <td>
                                <a th:href="@{/admin/categorias/editar/{id}(id=${c.id})}"
                                   class="btn btn-sm btn-outline-info">Editar</a>
                            </td>
                        </tr>
                        <tr th:if="${#lists.isEmpty(categorias)}">
                            <td colspan="4" class="text-center text-secondary">Sin categorías registradas.</td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </main>

    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
</body>

</html>
