spring.application.name=demo

server.port=8086

spring.sql.init.mode=always
spring.sql.init.data-locations=classpath:data.sql
spring.sql.init.schema-locations=classpath:schema.sql

spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

spring.datasource.type=com.zaxxer.hikari.HikariDataSource
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.max-lifetime=60000
spring.datasource.hikari.connection-timeout=30000

# Ver cada vez que se toma o devuelve una conexion
logging.level.com.zaxxer.hikari.pool.HikariPool=TRACE

# Ver creacion de conexiones
logging.level.com.zaxxer.hikari.pool.PoolBase=DEBUG

# Ver cuando se abren/cierran conexiones JDBC
logging.level.java.sql=DEBUG
logging.level.org.hibernate.engine.jdbc=DEBUG